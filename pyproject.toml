[project]
name = "cofola"
version = "0.1.0"
description = "A solver for combinatorics math problems using first-order logic"
readme = "README.md"
authors = [
    { name = "lucienwang1009", email = "lucienwang1009@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lark>=1.2",
    "loguru>=0.7",
    "numpy>=1.26",
    "scipy>=1.13.1",
    "sympy>=1.12",
    "wfomc",
]

[project.optional-dependencies]
coso = [
    "coso",
]

[project.scripts]
cofola = "cofola.solver:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/cofola"]
exclude = ["scripts", "tests", "**/__pycache__"]
typeCheckingMode = "basic"
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportOperatorIssue = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalIterable = "warning"
reportOptionalMemberAccess = "warning"
reportPossiblyUnboundVariable = "warning"
reportReturnType = "warning"

[tool.uv]
override-dependencies = [
    "clingo>=5.8",
]

[tool.uv.sources]
wfomc = { git = "https://github.com/yuanhong-wang/WFOMC.git", branch = "for_cofola_aij" }
coso = { git = "https://github.com/PietroTotis/CoSo.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
]
